name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  resolve_backend_url:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.backend.outputs.api_url }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install --global @railway/cli
      - name: Resolve Railway public API URL
        id: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN manquant"; exit 1; }
          backend_domain="$(railway variable list --json --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" | jq -er '.RAILWAY_PUBLIC_DOMAIN | select(type == "string" and length > 0)')"
          case "$backend_domain" in
            https://*) backend_origin="${backend_domain%/}" ;;
            *) backend_origin="https://${backend_domain%/}" ;;
          esac
          echo "api_url=${backend_origin}/api" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    needs: resolve_backend_url
    if: ${{ success() && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ needs.resolve_backend_url.outputs.api_url }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Enable direct navigation to SPA routes on GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Publish frontend to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          force_orphan: true

  publish-backend:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sunu-mall-backend
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-railway:
    needs: [resolve_backend_url, publish-backend]
    if: ${{ success() && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install --global @railway/cli
      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN manquant"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "RAILWAY_PROJECT_ID manquant"; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "RAILWAY_SERVICE_ID manquant"; exit 1; }
          test -n "$RAILWAY_ENVIRONMENT_ID" || { echo "RAILWAY_ENVIRONMENT_ID manquant"; exit 1; }
          railway up --ci --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID"

      - name: Wait for deployed backend health
        env:
          API_URL: ${{ needs.resolve_backend_url.outputs.api_url }}
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "$API_URL/health/"

      - name: Show Railway runtime logs after failure
        if: ${{ failure() }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          railway logs --latest --lines 120 \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID"

  smoke-test:
    needs: [resolve_backend_url, deploy-frontend, deploy-railway]
    if: ${{ success() && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_URL: ${{ needs.resolve_backend_url.outputs.api_url }}
      FRONTEND_ORIGIN: https://${{ github.event.repository.owner.login }}.github.io
      FRONTEND_URL: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Check deployed frontend
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "$FRONTEND_URL" -o "$RUNNER_TEMP/frontend.html"
          grep -Fq '<title>Sunu Mall</title>' "$RUNNER_TEMP/frontend.html"

      - name: Check public catalog API and CORS
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            "$API_URL/catalog/products/" -o "$RUNNER_TEMP/catalog.json"
          jq -e 'type == "object" and .count >= 16 and (.results | length > 0)' "$RUNNER_TEMP/catalog.json" >/dev/null
          product_image="$(jq -er '.results[0].images[0].url | select(type == "string" and length > 0)' "$RUNNER_TEMP/catalog.json")"
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "$product_image" -o /dev/null
          curl --fail --silent --show-error -X OPTIONS \
            -H "Origin: $FRONTEND_ORIGIN" \
            -H 'Access-Control-Request-Method: GET' \
            -D "$RUNNER_TEMP/cors.headers" \
            -o /dev/null \
            "$API_URL/catalog/products/"
          tr -d '\r' < "$RUNNER_TEMP/cors.headers" | grep -Fqi "access-control-allow-origin: $FRONTEND_ORIGIN"

      - name: Check browser session cookie policy
        run: |
          curl --fail --silent --show-error \
            -H "Origin: $FRONTEND_ORIGIN" \
            -D "$RUNNER_TEMP/csrf.headers" \
            "$API_URL/auth/browser/csrf/" \
            -o "$RUNNER_TEMP/csrf.json"
          jq -e '.csrfToken | type == "string" and length > 10' "$RUNNER_TEMP/csrf.json" >/dev/null
          tr -d '\r' < "$RUNNER_TEMP/csrf.headers" | grep -Eqi '^set-cookie: csrftoken='
          tr -d '\r' < "$RUNNER_TEMP/csrf.headers" | grep -Eqi '^set-cookie:.*[; ]Secure([; ]|$)'
          tr -d '\r' < "$RUNNER_TEMP/csrf.headers" | grep -Eqi '^set-cookie:.*SameSite=None([; ]|$)'

      - name: Show Railway runtime logs after smoke failure
        if: ${{ failure() }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          npx --yes @railway/cli logs --latest --lines 120 \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID"
